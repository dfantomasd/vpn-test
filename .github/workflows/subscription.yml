name: Subscription

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: subscription-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_clients.py --check
      - uses: ./.github/actions/check-xray

  refresh:
    needs: validate
    if: >-
      vars.ENABLE_SUBSCRIPTION_REFRESH == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh from owner-configured source
        env:
          SUBSCRIPTION_URL: ${{ secrets.SUBSCRIPTION_URL }}
          DIRECT_EXTRA_DOMAINS: ${{ vars.DIRECT_EXTRA_DOMAINS }}
        run: python scripts/refresh_subscription.py
      - name: Rebuild client subscriptions and Russia rules
        run: python scripts/build_clients.py --refresh-rules
      - name: Install pinned Mihomo for bounded network tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.19.30 --repo MetaCubeX/mihomo --pattern mihomo-linux-amd64-v1-v1.19.30.gz --dir "$RUNNER_TEMP"
          gzip -d "$RUNNER_TEMP/mihomo-linux-amd64-v1-v1.19.30.gz"
          chmod u+x "$RUNNER_TEMP/mihomo-linux-amd64-v1-v1.19.30"
      - name: Measure servers (three bounded 256 KiB samples per node)
        run: python scripts/measure_nodes.py --mihomo "$RUNNER_TEMP/mihomo-linux-amd64-v1-v1.19.30"
      - name: Publish measured order and annotations
        run: python scripts/build_clients.py
      - run: python -m unittest discover -s tests -v
      - uses: ./.github/actions/check-xray
      - name: Commit catalog
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md whitelist_configs_combined.json subscription.txt subscription_karing.txt routing_russia.json build_report.json measurements.json rules/
          git commit -m 'Update subscription catalog'
          git push origin HEAD:main
